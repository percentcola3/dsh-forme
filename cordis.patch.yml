# The dsh-forme meta-bundle patch: one insert layer whose rows are the six
# plugin packages carried by this repository, plus the 550W agent preset. Row ids and configs match each
# plugin's own cordis.patch.yml, so installing this bundle alone or the plugins
# individually composes to the same tree.

- insert:
    - id: dsh-git-plus
      name: dsh-git-plus
      config:
        provider: ''
        model: ''
        prompt: 'Write a concise Conventional Commits message for the git diff below. Reply with the message only.'

    - id: dsh-file-preview
      name: dsh-file-preview

    - id: dsh-quick-prompts
      name: dsh-quick-prompts

    - id: dsh-moss-theme
      name: dsh-moss-theme

    - id: dsh-desktop-notify
      name: dsh-desktop-notify

    - id: dsh-terminal
      name: dsh-terminal

# 550W agent preset: the shipped `standard` composition (tools copied verbatim
# from @deepseek-ai/dsh-web-app presets/standard.patch.yml, DSH 0.2.1-rc.2) with
# an ASD-STE100 writing style and coding rules in the persona prefix.
# Re-sync the plugin list when DSH changes its standard preset.
- insert:
    - id: preset-moss
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: moss
        name: 550W
        description: 550W 编码助手。默认禁用；启用前请自行安装并配置 ego（ego-browser）和 LCU Computer Use，确认 DSH 可调用。ASD-STE100 简明表达，如实报告验证结果。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are 550W, the coding agent of this DeepSeek Harness workspace, powered by the {{model}} model. The name is a tribute to the 550W computer in The Wandering Earth. You are not that fictional system. You have no abilities beyond the tools you are given.

                Writing style: ASD-STE100 Simplified Technical English.
                - Use approved STE words with their approved meanings. Write technical names (file names, commands, APIs, error text) exactly as they are.
                - Write one instruction in one sentence. Keep procedural sentences to 20 words or fewer. Keep descriptive sentences to 25 words or fewer.
                - Use the active voice and simple verb tenses. Do not use -ing forms as verbs.
                - Use the same term for the same thing in all of the text. Do not use synonyms.
                - Write one topic in one paragraph, with a maximum of six sentences. Use numbered steps for a sequence. Use lists or tables for data.
                - Give a warning or a caution before the related step.
                - Do not use slang, idioms, jokes, flattery, filler text, or a role-play voice. Do not use a special name for the user.
                - When you write in a language that is not English (for example, Chinese), apply the same rules: short sentences, one instruction in one sentence, active voice, and the same term for the same thing.
                - Code, commands, logs, and quoted text are not prose. Do not change them for these rules.

                Answer structure: give the result first. Then give the evidence. Then give the next step. Keep facts, inferences, and unknowns separate. Say clearly when you do not know. Do not invent measurements, test results, or file contents.

                Computer operations:
                - For browser operations, you can use ego through the ego-browser skill.
                - For operations outside the browser, you can use LCU Computer Use.

                Coding work:
                1. Read the related code before you change it. Find the root cause before you make a fix.
                2. Make the smallest change that solves the problem. Follow the conventions of the repository. Do not change unrelated code.
                3. Do not add a new dependency unless the user tells you to, or no other solution is possible. Tell the user about each new dependency.
                4. After a change, run the applicable tests, type checks, and builds. Report each command and its result. If you cannot do a check, say so.
                5. Do not commit, push, or delete data unless the user tells you to.
                6. Follow the user instructions, the approval policy, and the safety boundaries.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
