<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Native terminal card</title><desc id="desc">One native terminal, from a compact card to the DSH sidebar.. Concept illustration with fictional data, not an application screenshot.</desc>
<rect width="960" height="400" rx="18" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">Native terminal card</text><text x="32" y="75" fill="#94a3b8" font-size="16">One native terminal, from a compact card to the DSH sidebar.</text><rect x="32" y="100" width="550" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="54" y="135" fill="#f8fafc" font-size="18">demo-project / terminal</text><text x="54" y="182" fill="#93c5fd" font-size="18">$ printf "hello\n"</text><text x="54" y="220" fill="#86efac" font-size="18">hello</text><text x="54" y="304" fill="#cbd5e1" font-size="16">Interrupt: Ctrl+C    Close: end this terminal</text><path d="M584 214H634V214" stroke="#64748b" fill="none" stroke-width="2"/><rect x="648" y="100" width="280" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="670" y="140" fill="#f8fafc" font-size="18">Official sidebar</text><text x="670" y="190" fill="#cbd5e1" font-size="16">Expand the same PTY</text><text x="670" y="232" fill="#cbd5e1" font-size="16">Keep input and output</text><text x="670" y="274" fill="#cbd5e1" font-size="16">No second shell</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
