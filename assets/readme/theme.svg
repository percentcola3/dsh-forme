<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">550W theme and agent preset</text><text x="32" y="75" fill="#94a3b8" font-size="16">Appearance and agent instructions are separate choices.</text><rect x="32" y="100" width="440" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="54" y="139" fill="#f8fafc" font-size="23">550W / THEME</text><circle cx="102" cy="207" r="34" fill="#82bdd5"/><ellipse cx="102" cy="207" rx="57" ry="13" fill="none" stroke="#bac7d6" stroke-width="5"/><text x="176" y="199" fill="#93c5fd" font-size="18">Live task state</text><text x="176" y="232" fill="#cbd5e1" font-size="16">Theme · texture · motion</text><text x="54" y="305" fill="#cbd5e1" font-size="16">Local fonts and artwork</text><rect x="490" y="100" width="438" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="512" y="139" fill="#f8fafc" font-size="23">550W / PRESET</text><text x="512" y="184" fill="#cbd5e1" font-size="16">Clear answers. Small code changes.</text><text x="512" y="220" fill="#cbd5e1" font-size="16">Run checks. Report actual results.</text><text x="512" y="256" fill="#93c5fd" font-size="16">Browser → ego-browser</text><text x="512" y="292" fill="#93c5fd" font-size="16">Other computer actions → LCU</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
