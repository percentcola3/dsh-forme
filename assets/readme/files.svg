<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Files and references</title><desc id="desc">Browse native previews. Add context without sending the draft.. Concept illustration with fictional data, not an application screenshot.</desc>
<rect width="960" height="400" rx="18" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">Files and references</text><text x="32" y="75" fill="#94a3b8" font-size="16">Browse native previews. Add context without sending the draft.</text><rect x="32" y="100" width="250" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="52" y="135" fill="#f8fafc" font-size="18">demo-project</text><text x="65" y="176" fill="#cbd5e1" font-size="18">src/</text><text x="82" y="214" fill="#93c5fd" font-size="18">example.ts</text><text x="65" y="252" fill="#cbd5e1" font-size="18">docs/</text><text x="82" y="289" fill="#cbd5e1" font-size="18">guide.md</text><rect x="300" y="100" width="628" height="150" rx="12" fill="#172334" stroke="#334155"/><text x="322" y="135" fill="#f8fafc" font-size="18">example.ts</text><text x="322" y="175" fill="#93c5fd" font-size="18">export const greeting = "Hello";</text><text x="322" y="216" fill="#94a3b8" font-size="16">Select lines → Add reference</text><rect x="300" y="268" width="628" height="72" rx="12" fill="#172334" stroke="#334155"/><text x="322" y="298" fill="#93c5fd" font-size="18">@ src/example.ts : 1</text><text x="322" y="325" fill="#94a3b8" font-size="15">Draft stays editable. Nothing is sent automatically.</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
