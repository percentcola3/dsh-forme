<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Headless task cards</title><desc id="desc">One task context per card. The main conversation stays separate.. Concept illustration with fictional data, not an application screenshot.</desc>
<rect width="960" height="400" rx="18" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">Headless task cards</text><text x="32" y="75" fill="#94a3b8" font-size="16">One task context per card. The main conversation stays separate.</text><rect x="32" y="100" width="550" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="54" y="135" fill="#f8fafc" font-size="18">Main conversation</text><text x="54" y="181" fill="#cbd5e1" font-size="18">Continue your project discussion here.</text><rect x="50" y="266" width="514" height="53" rx="12" fill="#172334" stroke="#334155"/><text x="70" y="299" fill="#93c5fd" font-size="18">[ + ]   [ Review ]   [ Push ]</text><rect x="610" y="100" width="318" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="632" y="135" fill="#86efac" font-size="18">Review · Complete</text><text x="632" y="180" fill="#cbd5e1" font-size="16">You: Review this change.</text><text x="632" y="216" fill="#cbd5e1" font-size="16">AI: Here are the findings.</text><rect x="628" y="264" width="282" height="54" rx="12" fill="#172334" stroke="#334155"/><text x="644" y="297" fill="#93c5fd" font-size="16">Ask a follow-up…</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
