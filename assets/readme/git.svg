<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Git changes and branches</title><desc id="desc">Inspect the repository before an action.. Concept illustration with fictional data, not an application screenshot.</desc>
<rect width="960" height="400" rx="18" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">Git changes and branches</text><text x="32" y="75" fill="#94a3b8" font-size="16">Inspect the repository before an action.</text><rect x="32" y="100" width="260" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="50" y="132" fill="#f8fafc" font-size="18">demo-project / main</text><text x="50" y="174" fill="#cbd5e1" font-size="18">M  src/example.ts</text><text x="50" y="212" fill="#cbd5e1" font-size="18">+  tests/example.test.ts</text><text x="50" y="300" fill="#93c5fd" font-size="18">Branch: feature/demo</text><rect x="310" y="100" width="300" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="330" y="132" fill="#f8fafc" font-size="18">Before</text><rect x="326" y="160" width="268" height="50" rx="12" fill="#3b2029" stroke="#334155"/><text x="340" y="191" fill="#fda4af" font-size="18">return oldValue;</text><rect x="628" y="100" width="300" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="648" y="132" fill="#f8fafc" font-size="18">After</text><rect x="644" y="160" width="268" height="50" rx="12" fill="#12372e" stroke="#334155"/><text x="658" y="191" fill="#86efac" font-size="18">return newValue;</text><text x="648" y="300" fill="#94a3b8" font-size="16">Review the diff first.</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
