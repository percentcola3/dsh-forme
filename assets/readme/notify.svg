<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">Desktop task alerts</title><desc id="desc">A native macOS panel can appear while another app has focus.. Concept illustration with fictional data, not an application screenshot.</desc>
<rect width="960" height="400" rx="18" fill="#0b1220"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#f1f5f9" font-size="25">Desktop task alerts</text><text x="32" y="75" fill="#94a3b8" font-size="16">A native macOS panel can appear while another app has focus.</text><rect x="32" y="100" width="510" height="240" rx="12" fill="#172334" stroke="#334155"/><text x="54" y="135" fill="#f8fafc" font-size="18">Your current application</text><text x="54" y="185" fill="#cbd5e1" font-size="18">Continue your work here.</text><text x="54" y="227" fill="#cbd5e1" font-size="16">The alert does not take keyboard focus.</text><rect x="570" y="100" width="358" height="240" rx="12" fill="#172334" stroke="#334155"/><circle cx="650" cy="185" r="37" fill="#d8b78d"/><path d="M618 173Q650 186 682 173M616 188Q650 203 684 188M625 206Q650 217 675 206" fill="none" stroke="#a57555" stroke-width="7"/><circle cx="842" cy="185" r="37" fill="#c45b5b"/><text x="602" y="254" fill="#cbd5e1" font-size="16">Complete</text><text x="777" y="254" fill="#cbd5e1" font-size="16">Needs attention</text><text x="592" y="303" fill="#93c5fd" font-size="16">Click to return to the task.</text><text x="32" y="378" fill="#94a3b8" font-size="12">CONCEPT ILLUSTRATION / FICTIONAL DATA / NOT A SCREENSHOT</text></g></svg>
