<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>550W / DSH Theme Preview</title>
<style>

margin:24px 0 40px auto;border-radius:6px}.fixture-speaker{font:12px ui-monospace,monospace;letter-spacing:2px;color:#c4c9d1}.fixture-speaker small{margin-left:14px;font:10px sans-serif;color:var(--dsw-alias-label-tertiary)}h1{font-size:25px;font-weight:500;letter-spacing:1px;margin:22px 0 14px}.fixture-assistant p{color:var(--dsw-alias-label-secondary);font-size:13px;line-height:1.9}.fixture-report{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--dsw-alias-border-l2,#ddd);padding:20px 0;margin:26px 0;gap:16px}.fixture-report span{font:10px ui-monospace,monospace;color:var(--dsw-alias-label-tertiary)}.fixture-report b{display:block;font:11px ui-monospace,monospace;color:var(--dsw-alias-label-primary);margin-top:12px}pre{padding:18px;background:var(--dsw-alias-markdown-code-block,#eee);border:1px solid var(--dsw-alias-border-l1,#ddd);font:11px/2 ui-monospace,monospace;color:var(--dsw-alias-label-secondary)}.fixture-composer{max-width:750px;margin:60px auto 90px;padding:16px 20px;background:var(--dsw-specific-input-major,#fafafa)}.fixture-composer textarea{width:100%;background:transparent;border:0;resize:none;min-height:66px;outline:none;color:inherit}.fixture-composer>div{display:flex;justify-content:space-between;align-items:center;color:var(--dsw-alias-label-tertiary);font:10px ui-monospace,monospace}.fixture-composer button{background:#c9363e;color:white;border:0;width:30px;height:30px;border-radius:4px}.fixture-controls{position:fixed;z-index:10000;bottom:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:10px 20px;background:var(--dsw-alias-bg-layer-2,#eee);border-top:1px solid var(--dsw-alias-border-l2,#ddd);font-size:11px}.fixture-controls span{margin-right:auto;color:var(--dsw-alias-label-secondary)}.fixture-controls button{border:1px solid var(--dsw-alias-border-l2,#ddd);border-radius:3px;color:inherit;background:transparent;padding:4px 9px}@media(max-width:700px){.fixture-sidebar{display:none}header{gap:10px;padding:12px}header strong{display:none}.fixture-chat{padding:0 20px;margin-top:22px}.fixture-composer{margin:30px 12px 140px}.fixture-report{grid-template-columns:1fr}h1{font-size:22px}}
.fixture-hero{display:flex;justify-content:center;text-align:center;margin:80px 20px 32px}.fixture-hero>div{display:flex;flex-direction:column;align-items:center}.fixture-native-title{font-size:26px}.fixture-composer-stack{max-width:750px;margin:40px auto 100px}.fixture-composer-stack .fixture-composer{margin:0}.fixture-running{display:flex;flex-direction:column;align-items:flex-start;margin-top:12px;color:#7aa7ff;font-size:12px;line-height:22px}.fixture-running-content{display:inline-flex;gap:6px}.fixture-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}@media(max-width:700px){.fixture-hero{margin-top:38px}.fixture-composer-stack{margin:24px 12px 150px}}
/* Match the host Markdown's baseline so theme-off remains a useful comparison. */
.fixture-markdown{font-size:14px;line-height:24px;color:var(--dsw-alias-label-primary)}.fixture-markdown p{margin:16px 0}.fixture-markdown h1{font-size:22px}.fixture-markdown h2{font-size:18px;margin:24px 0 12px}.fixture-markdown blockquote{margin:16px 0;padding-left:14px;border-left:2px solid var(--dsw-alias-label-caption)}.fixture-markdown li{margin-top:6px}.fixture-chat{margin-top:28px}.fixture-chat>.fixture-label{margin-top:0}.fixture-user{margin:16px 0 30px auto}.fixture-composer-stack{margin-top:32px}

-color:#d75b62;color:#f1f2f4}.fixture-focus-sample input{width:100%;padding:9px;border:1px solid var(--dsw-alias-border-l3);border-radius:4px;color:inherit;background:var(--dsw-alias-markdown-code-block);font:11px var(--moss-text)}.fixture-focus-sample input:focus{outline:1px solid #d75b62;outline-offset:3px}.fixture-focus-sample button{margin-top:14px;display:flex;align-items:center;gap:7px;background:transparent;color:#e1e4e9;border:1px solid #d75b6266;border-radius:3px;padding:7px 10px;font:11px var(--moss-text)}@media(max-width:700px){.fixture-details{padding:0 20px}.fixture-detail-grid{grid-template-columns:1fr 1fr;gap:20px}.fixture-focus-sample{grid-column:1/-1}.fixture-details-heading small{display:none}.fixture-sidebar .moss-icon{width:12px}header nav button{gap:5px;padding:6px 8px}}@media(max-width:420px){.fixture-type-sample strong{font-size:22px}}
body[data-moss-theme="on"]:has(.fixture-controls):has(.moss-titlebar)>#root{height:auto;min-height:calc(100vh - 36px)}body:has(.moss-titlebar) .fixture-sidebar{min-height:calc(100vh - 36px)}body:has(.moss-titlebar) header{position:sticky;top:36px;z-index:3}.fixture-brand{margin:0 8px 28px}.fixture-boot{position:fixed;inset:36px 0 0;z-index:10060;display:grid;place-items:center;text-align:center}.fixture-boot>style{display:none}.fixture-boot>div{padding:32px}.fixture-boot [data-dsh-boot-spinner]{display:block}
