<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>550W</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:#0b0c0e;color:#eceef1}body{margin:0;min-height:100vh;display:grid;place-items:center}.drag{position:fixed;inset:0 0 auto;height:38px;border-bottom:1px solid #ffffff12;display:flex;justify-content:flex-end;-webkit-app-region:drag}.drag button{width:40px;padding:0;border:0;border-left:1px solid #ffffff10;border-radius:0;background:transparent;-webkit-app-region:no-drag}.drag button:hover{background:#ffffff10}main{text-align:center;max-width:360px;padding:32px}img{width:260px;height:94px;animation:reveal .8s ease-out both}h1{font-size:11px;font-weight:400;letter-spacing:.25em;margin:20px 0;color:#aab1bd}p{font-size:12px;line-height:1.7;color:#a0a7b3}.signal{display:block;width:140px;height:2px;margin:28px auto;background:linear-gradient(90deg,#dc1830 18%,#d0d4dc 18%);animation:pulse 1.8s ease-in-out infinite}button{border:1px solid #e3444866;border-radius:4px;background:#e3444822;color:white;padding:9px 24px;font:inherit;cursor:pointer}button[hidden]{display:none}@keyframes pulse{50%{opacity:.35}}@keyframes reveal{from{opacity:.25;filter:blur(2px)}to{opacity:1;filter:none}}@media(prefers-reduced-motion:reduce){img,.signal{animation:none}}
</style>
<div class="drag" data-tauri-drag-region><button id="minimize" aria-label="最小化窗口">─</button><button id="maximize" aria-label="最大化或还原窗口">□</button></div>
<main><img src="550w.svg" alt="550W"><h1>智能量子计算机 / INTELLIGENT QUANTUM COMPUTER</h1><span class="signal" aria-hidden="true"></span><p id="status">正在启动 550W…</p><button id="retry" hidden>重试</button></main>
<script>
const invoke = window.__TAURI__.core.invoke;
const status = document.getElementById('status');
let nativeWindow;
try { nativeWindow = window.__TAURI__.window?.getCurrentWindow?.(); } catch { /* Keep service status available if the window bridge is absent. */ }
for (const [id, method] of [['minimize', 'minimize'], ['maximize', 'toggleMaximize']]) {
  const button = document.getElementById(id);
  button.hidden = typeof nativeWindow?.[method] !== 'function';
  button.onclick = async () => { try { await nativeWindow[method](); } catch { status.textContent = '请使用系统窗口按钮。'; } };
}
const retry = document.getElementById('retry');
retry.onclick = async () => { retry.hidden = true; status.textContent = '正在重新启动…'; try { await invoke('dsh_restart') } catch { status.textContent = '无法重启服务，请退出 App 后重试。'; retry.hidden = false } };
async function refresh() { try { const state = await invoke('dsh_status'); status.textContent = state.message || '正在打开工作区…'; retry.hidden = state.phase !== 'error' } catch { status.textContent = '正在连接…' } }
refresh(); setInterval(refresh, 500);
</script>
</html>
